<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>UYAP Aktarım</title>
<style>
  body { width: 300px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; padding: 14px; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p.desc { font-size: 12px; color: #667085; margin: 0 0 12px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d7dbe0; border-radius: 6px; font-size: 12px; }
  button { margin-top: 12px; width: 100%; padding: 8px; border: none; border-radius: 6px; background: #1e3a5f; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.secondary { margin-top: 6px; background: #fff; color: #1e3a5f; border: 1px solid #1e3a5f; }
  #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
  .ok { color: #15803d; }
  .err { color: #b91c1c; }
  a { color: #1e3a5f; }
</style>
</head>
<body>
  <h1>UYAP Aktarım</h1>
  <p class="desc">
    Erişim anahtarınızı panelden alın:
    <a href="https://hukukcuyapayzekasi.com/panel/ayarlar/uyap-eklenti" target="_blank" rel="noopener">Ayarlar → UYAP Eklentisi</a>
  </p>
  <label for="token">Erişim Anahtarı</label>
  <input id="token" type="password" placeholder="uyapext_..." autocomplete="off" />
  <label for="apiBase">API Adresi (varsayılan üretim)</label>
  <input id="apiBase" type="text" placeholder="https://api.hukukcuyapayzekasi.com" />
  <button id="save" type="button">Kaydet</button>
  <button id="test" type="button" class="secondary">Bağlantıyı Test Et</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
