# CI — her PR ve main push'unda: Python testleri + lint, TypeScript tip kontrolü + build.
# Kırmızıysa merge ETMEYİN. PII sızıntı testi (tests/test_pii_leak_e2e.py) burada koşar;
# kırmızı olması KVKK taahhüdünün ihlali demektir.
#
# NOT: pytest artık TÜM tests/ klasörünü koşar. Eskiden dosya adları elle
# listeleniyordu ve listeye eklenmesi unutulan üç dosya hiç çalışmıyordu —
# bunlardan biri iyzico webhook imza doğrulama testiydi (test_billing_security.py),
# yani ödeme güvenliği regresyonları merge öncesi hiç yakalanmıyordu.
# Yeni test dosyası eklendiğinde bu dosyayı güncellemek GEREKMEZ.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için arka arkaya push yapıldığında eski koşuları iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıklar
        run: |
          pip install -r requirements.txt -r requirements-dev.txt || pip install -r requirements.txt
          pip install pytest pytest-cov ruff httpx psycopg

      # Sözdizimi/tanımsız isim gibi ÇALIŞMA ZAMANI hataları merge'i engeller.
      # (F821 = tanımsız isim, E9 = sözdizimi, F63/F7 = kesin hatalı ifade)
      - name: Ruff — kritik hatalar (bloklayıcı)
        run: ruff check api services llm common scripts pipelines scrapers tests --select E9,F63,F7,F82

      # Stil/kullanılmayan import gibi kalemler: görünürlük amaçlı, bloklamaz.
      # Temizlendikçe --select listesi yukarı taşınmalı.
      - name: Ruff — stil (bilgilendirme)
        run: ruff check api services llm common scripts pipelines scrapers tests --ignore E501 || true

      - name: Pytest (DB gerektirmeyen tüm testler)
        env:
          PYTHONPATH: .
          # TCKN doğrulaması sandbox'ta iyzico örnek numarasına izin veriyor;
          # CI'da prod davranışını test edelim.
          IYZICO_BASE_URL: https://api.iyzipay.com
        run: |
          pytest tests/ -q --ignore=tests/test_db_integration.py \
                 --cov=api --cov=services --cov=common --cov=llm \
                 --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Coverage özetini iş akışına yaz
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"### Test kapsamı: **{float(r.get('line-rate', 0)) * 100:.1f}%**")
          PY
          fi

      - name: Coverage raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  db-tests:
    name: Backend (Postgres entegrasyon — RLS + crypto-shred)
    runs-on: ubuntu-latest
    # RLS izolasyonu ve kriptografik silme testleri canlı Postgres ister.
    # Eskiden bunlar SADECE elle koşulabiliyordu; artık her PR'da koşuyor.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hukuk_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bağımlılıklar
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Şema kur
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
          PYTHONPATH: .
        run: python -m scripts.init_db || echo "::warning::Şema kurulumu atlandı"
      - name: RLS + şifreleme entegrasyon testleri
        env:
          RUN_DB_TESTS: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukuk_test
          PYTHONPATH: .
        run: pytest tests/test_db_integration.py -q

  frontend:
    name: Frontend (tsc + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bağımlılıklar
        run: npm ci
      # DİKKAT: next.config.mjs'de ignoreBuildErrors:true olduğu için
      # `next build` tip hatalarını YUTAR. Tip güvenliğinin tek gerçek kapısı
      # bu adımdır — asla `|| true` eklemeyin.
      - name: TypeScript tip kontrolü (bloklayıcı)
        run: npx tsc --noEmit
      - name: ESLint
        run: npx next lint --max-warnings=0 || true
      - name: Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  guvenlik:
    name: Güvenlik taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Bilinen açığı olan bağımlılıklar — bloklamaz, görünürlük sağlar.
      - name: pip-audit (Python bağımlılıkları)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc || true
      - name: npm audit (frontend bağımlılıkları)
        working-directory: web
        run: npm audit --audit-level=high || true
      # Repoya sızmış sır/anahtar taraması.
      - name: Gitleaks (secret taraması)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
