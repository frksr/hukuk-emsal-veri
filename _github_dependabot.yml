# Bağımlılık güncellemeleri — güvenlik yamalarını kaçırmamak için.
# Haftalık, sınırlı sayıda PR (gürültü yapmasın); güvenlik güncellemeleri
# bu limitten bağımsız olarak her zaman açılır.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["bagimlilik", "backend"]
    groups:
      # Küçük sürüm yükseltmelerini tek PR'da topla
      minor-ve-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["bagimlilik", "frontend"]
    groups:
      minor-ve-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["ci"]
